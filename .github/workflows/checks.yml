# Shared check suite. Called by ci.yml (pull requests, pushes to main) and by
# the release workflow's gate job, so a PR runs exactly what the release runs
# and the two cannot drift.
#
# E2E runs from ci.yml alone, so a release is not held up by an Electron
# window under xvfb.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run docs:check
      # Integration tests commit into real repos, and the runner has no git
      # identity of its own.
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: npx vitest run --project unit --project integration
